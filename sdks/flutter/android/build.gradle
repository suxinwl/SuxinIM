group = "io.openim.flutter_openim_sdk"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

def putyCoreRepository = file('libs')
rootProject.allprojects {
    repositories {
        ivy {
            url = uri(putyCoreRepository)
            patternLayout { artifact('[artifact].[ext]') }
            metadataSources { artifact() }
            content { includeGroup('io.puty') }
        }
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.openim.flutter_openim_sdk"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation 'io.puty:puty-core-sdk-3.8.3-patch15-enterprise:1@aar'
        implementation 'io.puty:puty-sqlcipher-android-4.19.1:1@aar'
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
