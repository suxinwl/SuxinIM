worker_processes auto;
events { worker_connections 8192; }
stream {
 resolver 127.0.0.11 valid=5s ipv6=off;
 upstream embedded_turn_tls { zone embedded_turn_tls 64k; server livekit:25349 resolve; }
 server {
  listen 23478;
  allow 192.168.6.0/24;
  allow 192.168.10.0/24;
  allow 192.168.14.0/24;
  allow 192.168.17.0/24;
  allow 192.168.18.0/24;
  allow 192.168.19.0/24;
  allow 192.168.26.0/24;
  allow 192.168.27.0/24;
  allow 192.168.28.0/24;
  allow 192.168.29.0/24;
  allow 192.168.30.0/24;
  allow 192.168.31.0/24;
  allow 192.168.32.0/24;
  deny all;
  # Plain TURN/TCP clients are bridged to the existing embedded TLS listener.
  # The private upstream still receives full chain and SAN verification.
  proxy_pass embedded_turn_tls;
  proxy_ssl on;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;
  proxy_ssl_trusted_certificate /certs/ca.crt;
  proxy_ssl_name openim38.test.local;
  proxy_ssl_server_name on;
  proxy_connect_timeout 10s;
  proxy_timeout 3600s;
 }
}
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 # Recreated Compose services may receive a different bridge address.
 resolver 127.0.0.11 valid=5s ipv6=off;
 upstream im_http { zone im_http 64k; server openim-api:10002 resolve; }
 upstream chat_http { zone chat_http 64k; server chat-api:10008 resolve; }
 upstream im_ws { zone im_ws 64k; server openim-msggateway:10001 resolve; }
 upstream enterprise_http { zone enterprise_http 64k; server enterprise-service:18090 resolve; }
 upstream minio_http { zone minio_http 64k; server minio:9000 resolve; }
 # Query strings can contain WebSocket/RTC credentials: never log them.
 log_format private '$remote_addr $request_method $uri $status $body_bytes_sent';
 access_log /dev/stdout private;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 map $http_origin $cors_origin {
  default '';
  'https://192.168.10.11:29880' $http_origin;
  'openim38://app' $http_origin;
  'http://127.0.0.1:7777' $http_origin;
  'http://127.0.0.1:7778' $http_origin;
 }
 # Fetch taints Origin on the API -> signed S3 cross-origin redirect.
 # Opaque-origin reads are allowed only on the attachment server, never APIs.
 map '$http_origin:$request_method:$http_access_control_request_method' $attachment_cors_origin {
  default $cors_origin;
  'null:GET:' 'null';
  'null:HEAD:' 'null';
  'null:OPTIONS:GET' 'null';
  'null:OPTIONS:HEAD' 'null';
 }
 proxy_hide_header Access-Control-Allow-Origin;
 proxy_hide_header Access-Control-Allow-Headers;
 proxy_hide_header Access-Control-Allow-Methods;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto https;
 # Core constructs attachment redirect URLs from this trusted API prefix.
 proxy_set_header X-Request-Api https://192.168.10.11:29880/api;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_read_timeout 3600s;
 proxy_send_timeout 3600s;
 client_max_body_size 1g;
 server {
  listen 29880 ssl;
  ssl_certificate /certs/server.crt;
  ssl_certificate_key /certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  allow 127.0.0.1;
  allow 192.168.6.0/24;
  allow 192.168.10.0/24;
  allow 192.168.14.0/24;
  allow 192.168.17.0/24;
  allow 192.168.18.0/24;
  allow 192.168.19.0/24;
  allow 192.168.26.0/24;
  allow 192.168.27.0/24;
  allow 192.168.28.0/24;
  allow 192.168.29.0/24;
  allow 192.168.30.0/24;
  allow 192.168.31.0/24;
  allow 192.168.32.0/24;
  deny all;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Resource-Policy cross-origin always;
  add_header X-Content-Type-Options nosniff always;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
  add_header Access-Control-Allow-Headers 'Content-Type, token, chatToken, platformID, operationID, X-Requested-With' always;
  add_header Access-Control-Expose-Headers 'ETag, Content-Disposition, Content-Length' always;
  add_header Vary Origin always;
  if ($request_method = OPTIONS) { return 204; }
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 'openim38-upgrade\n'; }
  location ^~ /internal/ { return 404; }
  location ^~ /api/auth/get_admin_token { return 403; }
  location = /chat/rtc/get_token_for_video_meeting { return 403; }
  location = /chat/user/rtc/get_token { return 403; }
  location /enterprise/v1/ { proxy_pass http://enterprise_http; }
  location /office/ { proxy_pass http://enterprise_http; }
  location /signaling/ { proxy_pass http://enterprise_http; }
  location /rtc/ { proxy_pass http://enterprise_http; }
  location /livekit/ { proxy_pass http://enterprise_http; }
  location = /api/msg/mark_group_message_read { proxy_pass http://enterprise_http/msg/mark_group_message_read; }
  location = /api/msg/get_group_message_read_num { proxy_pass http://enterprise_http/msg/get_group_message_read_num; }
  location = /api/msg/get_group_message_has_read { proxy_pass http://enterprise_http/msg/get_group_message_has_read; }
  location /api/ { proxy_pass http://im_http/; }
  location /chat/ { proxy_pass http://chat_http/; }
  location = /ws { proxy_pass http://im_ws/; }
  location /ws/ { proxy_pass http://im_ws/; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location = /downloads { return 301 /downloads/; }
  location = /downloads/ { try_files /downloads/index.html =404; }
  location /downloads/ { autoindex off; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
 }
 server {
  listen 29885 ssl;
  ssl_certificate /certs/server.crt;
  ssl_certificate_key /certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  allow 127.0.0.1;
  allow 192.168.6.0/24;
  allow 192.168.10.0/24;
  allow 192.168.14.0/24;
  allow 192.168.17.0/24;
  allow 192.168.18.0/24;
  allow 192.168.19.0/24;
  allow 192.168.26.0/24;
  allow 192.168.27.0/24;
  allow 192.168.28.0/24;
  allow 192.168.29.0/24;
  allow 192.168.30.0/24;
  allow 192.168.31.0/24;
  allow 192.168.32.0/24;
  deny all;
  location / {
   proxy_set_header Host $http_host;
   proxy_request_buffering off;
   proxy_buffering off;
   add_header Cross-Origin-Resource-Policy cross-origin always;
   add_header Access-Control-Allow-Origin $attachment_cors_origin always;
   add_header Access-Control-Allow-Methods 'GET, HEAD, PUT, POST, DELETE, OPTIONS' always;
   add_header Access-Control-Allow-Headers '*' always;
   add_header Access-Control-Expose-Headers 'ETag, Content-Disposition, Content-Length' always;
   add_header Vary Origin always;
   if ($request_method = OPTIONS) { return 204; }
   proxy_pass http://minio_http;
  }
 }
}
