[program:puty-hrm]
command=/usr/bin/python3 /srv/puty-suite/gosuxin/start_hrm.py
directory=/srv/puty-suite/gosuxin
user=puty
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/puty-suite/gosuxin/runtime/log/supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
